# smoke_search_4b_fp32_head.yaml on the commit-named training image prod_4node_search_4b.yaml uses
# (examples/tmax/docker/build_train_image.sh at d0831a475b: the same SGLang 7b6993a and Megatron 9df207fd1 as
# tmax-miles-train-20261029, docker/pip_pins.txt, Miles from the build context), at priority urgent without
# min_runtime, so Beaker can place it on unallocated capacity; the judge and the CPU services then keep none either.
# Same recipe, layout and per-GPU load: 3 steps of 2 questions x 8 rollouts, 128k per episode, fp32 logits on both sides.
exp_name: search_smoke_4b_fp32_head_imgd0831a475b
model_name: Qwen3.5-4B
prime_rl_source: /weka/oe-adapt-default/shashankg/miles_search/prime-rl-sources/a5fcb924645d9bd8f326efd5087c8de6447c83fe17c6d07c36e99ee736d30a37/source
prime_rl_config: configs/experiments/search-agent-bc-rl-v1-1-fp32-lr5e-7/rl.toml
num_gpus_per_node: 3
async_rollout_gpus: 1
rollout_batch_size: 2
n_samples_per_prompt: 8
num_rollout: 3
async_max_concurrent_samples: 32
max_seq_len: 131072
rollout_max_response_len: 32768
tensor_model_parallel_size: 1
context_parallel_size: 1
max_tokens_per_gpu: 131072
optimizer_cpu_offload: false
fp32_lm_head: true
save_interval: 1000
hf_snapshot_every: 0
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true

beaker:
  launcher: examples/tmax_search/run_search_qwen3_5.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  retries: 0
  gpus: 3
  shared_memory: 256GiB
  image: beaker:shashankg/tmax-miles-train-d0831a475b
  # Prime-RL's search services as tasks of this experiment (examples/tmax_search/beaker/services.py), fewer replicas.
  search_services:
    replicas: {terminal: 2, localsearch: 2}
