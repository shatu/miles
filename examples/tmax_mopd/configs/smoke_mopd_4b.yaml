# 4-GPU Holmes smoke of multi-teacher OPD into hamishivi/Qwen3.5-4B: allenai/tmax-4b teaches the terminal episodes and the
# search port's 4B run at step 280 the search episodes, on a 50/50 mix of TMax tasks and the bc-rl-1131 search
# questions. One node: 1 training GPU, 1 rollout engine and one SGLang server per teacher; the terminal sandboxes on
# the private podman fleet (a gateway on the head), the search services as tasks of the experiment (the judge on its
# own Holmes GPU, 2 search + 2 terminal replicas). 3 steps of 4 prompts x 4 rollouts at each domain's full budget
# (terminal 64k, search 128k), so a step almost surely holds both domains.
#   python examples/tmax/beaker/submit.py examples/tmax_mopd/configs/smoke_mopd_4b.yaml
exp_name: mopd_smoke_4b
model_name: Qwen3.5-4B-tmax-template          # hamishivi/Qwen3.5-4B
terminal_teacher: tmax-4b                     # allenai/tmax-4b
search_teacher: search-4b-bcrl-v11-step279    # search_prod4node_4b_bcrl_v11_high8h, HF snapshot step_279
search_fraction: 0.5
sandbox_backend: gateway                      # terminal containers on the fleet behind beaker.gateway_registry
prime_rl_source: /weka/oe-adapt-default/shashankg/miles_search/prime-rl-sources/ebe1abbae42ec6587ff36647fca2b007583abd4501e45e0be15a37a3e1495160/source
prime_rl_config: configs/experiments/search-agent-bc-rl-1131-fp32-lr5e-7/rl.toml
num_gpus_per_node: 4
async_rollout_gpus: 1                         # 1 training + 1 rollout + 2 teacher GPUs
rollout_batch_size: 4
n_samples_per_prompt: 4
num_rollout: 3
async_max_concurrent_samples: 32
save_interval: 1000
hf_snapshot_every: 0
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true

beaker:
  launcher: examples/tmax_mopd/run_mopd_qwen3_5.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: 8h                             # Holmes schedules no GPU task without it, the judge's included
  retries: 0
  gpus: 4
  shared_memory: 256GiB
  image: beaker:shashankg/tmax-miles-train-d0831a475b
  # The private fleet's head registry: the head starts a gateway from it (weka bucket oe-adapt-default is mounted).
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-private-reasoning-20261017.sqlite3
  env:
    MILES_SESSION_REQUEST_TIMEOUT_S: 600         # collect samples: wait up to 10 min instead of 2 (search's 128k)
  # Prime-RL's search services as tasks of this experiment (examples/tmax_search/beaker/services.py), fewer replicas.
  search_services:
    replicas: {terminal: 2, localsearch: 2}
