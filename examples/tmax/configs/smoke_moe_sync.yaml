# 4-GPU smoke test of the MoE launcher (sync): smoke_sync.yaml's 3 steps of 4 prompts x 4 samples on a 64-prompt
# subset, 16k per episode, for Qwen3.5-35B-A3B with EP 4 and R3. Preemptible capacity: no min_runtime.
num_gpus_per_node: 4
num_prompts: 64
rollout_batch_size: 4
n_samples_per_prompt: 4
num_rollout: 3
max_seq_len: 16384
tensor_model_parallel_size: 1
expert_model_parallel_size: 4
sglang_mem_fraction_static: 0.6
filter_zero_std: false
save_interval: 1000
episode_timeout_s: 3600
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output

beaker:
  launcher: examples/tmax/run_tmax_qwen3_5_moe.py
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  preemptible: true
  retries: 0
  gpus: 4
  shared_memory: 256GiB
  image: docker.io/radixark/miles:dev-202610151741
  sandbox_shards: 1
  dockerhub_username: shashankg209
