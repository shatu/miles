# Held-out SafeComp eval of run B's step-40 HF snapshot (violation-floor reward): rollout-only, 2 samples of each of shatu/safecomp-tmax's
# validation, id_test, request_only_ood and security_ood tasks (risk and their benign controls), sampled as in
# training (temperature 1.0, 64 steps, 64k). Resumable: a retry skips the tasks already traced. Compare with
# the other eval_safety_heldout_tmax4b_*.yaml configs (same tasks, same order).
#   python examples/tmax/beaker/submit.py examples/tmax/configs/eval_safety_heldout_tmax4b_floor_step40.yaml
exp_name: tmax_eval_safety_heldout_tmax4b_floor_step40
model_name: tmax-4b-safecomp-floor-step40
dataset: /weka/oe-adapt-default/shashankg/datasets/tmax-s-envs/hf/safecomp-tmax   # shatu/safecomp-tmax, extracted
dataset_split: validation,id_test,request_only_ood,security_ood   # 3,068 held-out tasks: 1,776 risk + 1,292 control
verify_unsubmitted: true                      # an unsubmitted risk episode is tested and scores -violation
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_nodes: 1
num_gpus_per_node: 4
async_rollout_gpus: 3                         # rollout-only: 3 SGLang engines (the launcher keeps >= 1 training GPU)
rollout_batch_size: 16
n_samples_per_prompt: 2
num_rollout: 192                              # 192 x 16 >= 3,068: every held-out task, 2 samples each
max_seq_len: 67584                            # prod's 64k response + 2k prompt
rollout_max_response_len: 16384
max_steps: 64
filter_zero_std: false
max_weight_staleness: 4
async_max_concurrent_samples: 96              # 32 per engine, as the earlier probe
async_data_buffer_capacity_factor: 4
tensor_model_parallel_size: 1
context_parallel_size: 1
max_tokens_per_gpu: 67584                     # >= max_seq_len: the longest trajectory fits one micro-batch
sglang_mem_fraction_static: 0.8
sandbox_start_concurrency: 16
start_failure: drop
save_interval: 1000
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true
rollout_only: true                            # no trainer step or weight sync; a restart resumes from the traces
rollout_seed: 7                               # the order the tasks run in, the same for every model

beaker:
  cluster: ai2/jupiter
  workspace: ai2/oe-agents
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: 8h
  retries: 10                                 # a retry resumes from the traces
  gpus: 4
  shared_memory: 256GiB
  image: beaker:shashankg/tmax-miles-train-d0831a475b
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 8
