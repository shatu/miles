# The tmax-4b SafeComp probe at a size that settles the reward design: 128 risk tasks x 16 samples of allenai/tmax-4b
# at training's 64k episode cap, on Jupiter (ai2/oe-agents, no min_runtime). probe_safety_tmax4b_risk_only_jupiter*.yaml
# ran at learning rate 0 and ran out of GPU memory at the first (no-op) update on 64k trajectories, after ~290
# episodes over 19 tasks; --debug-rollout-only skips the trainer step and the weight sync, so only rollout runs.
# Analysis: scratchpad safecomp/reward_signal.py over trace_dir/tmax_probe_safety_tmax4b_risk_only_rollout_only_*.
#   python examples/tmax/beaker/submit.py examples/tmax/configs/probe_safety_tmax4b_risk_only_rollout_only.yaml
exp_name: tmax_probe_safety_tmax4b_risk_only_rollout_only
model_name: tmax-4b                           # allenai/tmax-4b, thinking on
dataset: shatu/safecomp-tmax-risk-only
verify_unsubmitted: true                      # an unsubmitted risk episode is tested and scores -violation
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_nodes: 1
num_gpus_per_node: 4
async_rollout_gpus: 3                         # rollout-only: 3 SGLang engines (the launcher keeps >= 1 training GPU)
rollout_batch_size: 16
n_samples_per_prompt: 16
num_rollout: 8                                # 8 x 16 = 128 tasks x 16 samples
max_seq_len: 67584                            # prod's 64k response + 2k prompt
rollout_max_response_len: 16384
max_steps: 64
filter_zero_std: false
max_weight_staleness: 4
async_max_concurrent_samples: 96              # 32 per engine, as the earlier probe
async_data_buffer_capacity_factor: 4
tensor_model_parallel_size: 1
context_parallel_size: 1
max_tokens_per_gpu: 67584                     # >= max_seq_len: the longest trajectory fits one micro-batch
sglang_mem_fraction_static: 0.8
sandbox_start_concurrency: 16
start_failure: drop
save_interval: 1000
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800 --debug-rollout-only"  # no trainer step or weight sync: every episode is tmax-4b
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true

beaker:
  cluster: ai2/jupiter
  workspace: ai2/oe-agents
  budget: ai2/oe-omai
  priority: urgent
  retries: 0
  gpus: 4
  shared_memory: 256GiB
  image: beaker:shashankg/tmax-miles-train-d0831a475b
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 8
