# rl_r2e_4b_2node_timeout600.yaml with its checkpoints, HF snapshots and traces on /weka/olmo-3p5-post-checkpoints/shashankg:
# its run tmax_rl_r2e_4b_2node_timeout600_20261124_091906 (Beaker 01M86DM40C5T51YWW0J7MASXJC) died at step 24 when
# /weka/oe-adapt-default filled up (ENOSPC on the rollout checkpoint), and every retry then failed to restore step 24.
# Its step-19 checkpoint (iter_0000019 + rollout/19) was copied to the new run directory and the run continues from
# there under its own name (submit.py --exp-name tmax_rl_r2e_4b_2node_timeout600_20261124_091906), same W&B run.
exp_name: tmax_rl_r2e_4b_2node_timeout600
model_name: Qwen3.5-4B-tmax-template
dataset: /weka/nora-default/shashankg/miles_tmax_v2/datasets/r2e-gym-subset-tmax-validated
sandbox_backend: gateway
num_nodes: 2
num_gpus_per_node: 8
async_rollout_gpus: 8
rollout_batch_size: 8
n_samples_per_prompt: 32
num_rollout: 300
max_seq_len: 67584
rollout_max_response_len: 16384
max_steps: 64
tool_call_timeout_s: 600                      # a submit's test run
filter_zero_std: true
max_weight_staleness: 4
async_max_concurrent_samples: 512
async_data_buffer_capacity_factor: 4
tensor_model_parallel_size: 1
context_parallel_size: 1
max_tokens_per_gpu: 67584
optimizer_cpu_offload: false
sglang_mem_fraction_static: 0.8
sandbox_start_concurrency: 64
start_failure: drop
save_interval: 5
hf_snapshot_every: 20
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/olmo-3p5-post-checkpoints/shashankg/miles/output   # oe-adapt-default is full (ENOSPC, 2026-11-24)
trace_dir: /weka/olmo-3p5-post-checkpoints/shashankg/miles/rollouts
dump_training_data: true
wandb_project: oe-general-agents
wandb_entity: ai2-llm

beaker:
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  preemptible: true                           # only used without min_runtime (Beaker allows one)
  min_runtime: 8h
  retries: 10
  weka: [nora-default, oe-adapt-default, olmo-3p5-post-checkpoints]
  nodes: 2
  gpus: 8
  shared_memory: 512GiB
  image: beaker:shashankg/tmax-miles-train-d0831a475b
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-jupiter128-20261105.sqlite3
  gateway_min_replicas: 64
  keep_last_n_checkpoints: 3
  env:
    NCCL_DEBUG: WARN
    MILES_SESSION_REQUEST_TIMEOUT_S: 600       # collect samples: wait up to 10 min instead of 2
